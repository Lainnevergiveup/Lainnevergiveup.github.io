name: Update README

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update last refreshed timestamp
        run: |
          sed -i "s/<!-- last-updated:.* -->/<!-- last-updated: $(date -u +'%Y-%m-%d %H:%M UTC') -->/" README.md || true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && git diff --staged --quiet || (git add -A && git commit -m "chore: auto-update README" && git push)
